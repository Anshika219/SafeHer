<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeHer - Women Safety</title>
<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
    color: #222;
    min-height: 100vh;
}

/* Header */
header {
    background: linear-gradient(90deg, #e63946, #ff4d6d);
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

/* Navigation */
nav {
    background: #1f1f1f;
    padding: 12px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav button {
    margin: 6px;
    padding: 10px 14px;
    color: white;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s ease;
}

nav button:hover {
    background: #e63946;
    transform: scale(1.05);
}

/* Sections */
.section {
    display: none;
    padding: 25px;
    animation: fadeIn 0.4s ease-in-out;
}

.active {
    display: block;
}

/* Smooth entry */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Panic Button (Important UI upgrade) */
.panic-btn {
    background: radial-gradient(circle, #ff0000, #b30000);
    color: white;
    padding: 35px;
    font-size: 20px;
    border: none;
    border-radius: 50%;
    display: block;
    margin: 25px auto;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.4);
    transition: 0.3s;
    font-weight: bold;
}

.panic-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(255,0,0,0.6);
}

/* Cards */
.card {
    background: white;
    padding: 16px;
    margin: 12px 0;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-3px);
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #e63946;
    box-shadow: 0 0 8px rgba(230,57,70,0.2);
}

/* Submit Button */
button.submit {
    background: linear-gradient(90deg, #e63946, #ff4d6d);
    color: white;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button.submit:hover {
    transform: scale(1.05);
}

/* Mobile Responsive */
@media (max-width: 600px) {
    nav button {
        padding: 8px 10px;
        font-size: 12px;
    }

    .panic-btn {
        padding: 28px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header>
<h1>SafeHer</h1>
<p>Your Safety Companion</p>
</header>

<nav>
<button onclick="showSection('home')">Home</button>
<button onclick="showSection('profile')">Profile</button>
<button onclick="showSection('contacts')">Contacts</button>
<button onclick="showSection('dashboard')">Dashboard</button>
</nav>

<!-- HOME -->
<div id="home" class="section active">
<h2>Emergency Help</h2>

<button class="panic-btn" onclick="panicAlert()">🚨 PANIC</button>

<a href="tel:112" style="text-decoration:none;">
  <button class="panic-btn">📞 CALL 112</button>
</a>

<p style="text-align:center;">Click panic → Alerts + location sent</p>
</div>

<!-- PROFILE -->
<div id="profile" class="section">
<h2>User Profile</h2>

<input id="username" placeholder="Enter your name">
<input id="userphone" placeholder="Enter your phone number">

<button class="submit" onclick="saveUser()">Save Profile</button>

<p id="savedUser"></p>
</div>

<!-- CONTACTS -->
<div id="contacts" class="section">
<h2>Emergency Contacts</h2>

<input id="contactName" placeholder="Contact Name">
<input id="contactPhone" placeholder="Contact Phone">

<button class="submit" onclick="addContact()">Add Contact</button>

<div id="contactList"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
<h2>📍 Live Tracking</h2>
<div id="locationData"></div>
<iframe id="map" style="width:100%; height:300px;"></iframe>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// ✅ YOUR REAL CONFIG (already filled)
const firebaseConfig = {
  apiKey: "AIzaSyCEGJG68RGPtwxrL-pcPFbw0P2T-xIDPp8",
  authDomain: "safeher-c7a21.firebaseapp.com",
  projectId: "safeher-c7a21",
  storageBucket: "safeher-c7a21.firebasestorage.app",
  messagingSenderId: "814529082691",
  appId: "1:814529082691:web:aa47ff6d2da967140f6bf6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// Navigation
function showSection(id){
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}


// 🚨 PANIC ALERT
function panicAlert(){

    if(!confirm("Are you in danger?")) return;

    let alarm = new Audio("https://www.soundjay.com/button/beep-07.wav");
    alarm.play();

    db.collection("contacts").get().then(snapshot => {

        if(snapshot.empty){
            alert("No contacts saved!");
            return;
        }

        navigator.geolocation.getCurrentPosition(position => {

            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            let locationLink = `https://maps.google.com/?q=${lat},${lon}`;

            let message = `🚨 EMERGENCY ALERT 🚨
I need help immediately!
📍 ${locationLink}`;

            // Save location
            db.collection("locations").add({
                lat, lon,
                time: Date.now()
            });

            // Send WhatsApp to all contacts
            snapshot.forEach(doc => {
                let c = doc.data();
                let phone = c.phone.replace(/\D/g, "");

                let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
                window.open(url, "_blank");
            });

        }, () => alert("Allow location access!"));

    });
}


// Save User
function saveUser(){
    let name = document.getElementById("username").value;
    let phone = document.getElementById("userphone").value;

    localStorage.setItem("user", JSON.stringify({name, phone}));

    document.getElementById("savedUser").innerText =
        `Saved: ${name} (${phone})`;
}


// Load User
function loadUser(){
    let user = JSON.parse(localStorage.getItem("user"));
    if(user){
        document.getElementById("savedUser").innerText =
            `Saved: ${user.name} (${user.phone})`;
    }
}


// Add Contact
function addContact(){
    let name = document.getElementById("contactName").value;
    let phone = document.getElementById("contactPhone").value;

    db.collection("contacts").add({name, phone})
    .then(() => {
        alert("Contact added!");
        displayContacts();
    });

    document.getElementById("contactName").value = "";
    document.getElementById("contactPhone").value = "";
}


// Display Contacts
function displayContacts(){
    db.collection("contacts").onSnapshot(snapshot => {

        let list = document.getElementById("contactList");
        list.innerHTML = "";

        snapshot.forEach(doc => {
            let c = doc.data();

            list.innerHTML += `
            <div class="card">
                ${c.name} - ${c.phone}
            </div>`;
        });
    });
}


// 📍 Dashboard (Improved)
function loadDashboard(){
    db.collection("locations")
    .orderBy("time","desc")
    .limit(10)
    .onSnapshot(snapshot => {

        let container = document.getElementById("locationData");
        container.innerHTML = "";

        let first = true;

        snapshot.forEach(doc => {
            let loc = doc.data();

            container.innerHTML += `
            <div class="card">
                Lat: ${loc.lat} <br>
                Lon: ${loc.lon}
            </div>`;

            // Show only latest on map
            if(first){
                document.getElementById("map").src =
                `https://maps.google.com/maps?q=${loc.lat},${loc.lon}&z=15&output=embed`;
                first = false;
            }
        });
    });
}


// Load everything
loadUser();
displayContacts();
loadDashboard();

</script>

</body>
</html>
